# 生产环境配置: mvn spring-boot:run -Dspring-boot.run.profiles=prod
# 或 java -jar smart-kb.jar --spring.profiles.active=prod
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smartkb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      mode: never       # 生产建表手动执行 schema.sql, 不随启动自动跑
  h2:
    console:
      enabled: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
